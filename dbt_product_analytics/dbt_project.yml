name: product_analytics_engine
version: '1.0.0'
config-version: 2

profile: 'product_analytics_engine'

# Model paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variables for date filtering — override via .env or dbt CLI:
#   dbt build --vars '{"ga4_start_date": "20210101", "ga4_end_date": "20210131"}'
vars:
  ga4_start_date: "20210101"
  ga4_end_date: "20210131"

# Default materializations by folder
models:
  product_analytics_engine:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
